[project]
name = "moral-outrage-classifier"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "team-llm",
    "boto3>=1.42.96",
    "google-api-python-client>=2.193.0",
    "langdetect>=1.0.9",
    "litellm==1.81.0",
    "numpy>=2.4.3",
    "pandas>=3.0.1",
    "pydantic>=2.12.5",
    "python-dotenv>=1.2.2",
    "scikit-learn>=1.8.0",
    "tenacity>=9.1.4",
    "tqdm>=4.67.3",
]

[project.optional-dependencies]
test = [
    "pytest>=9.0.2",
    "rich>=14.3.3",
]
examples = [
    "typer>=0.24.1",
]
streamlit = [
    "streamlit>=1.44",
]

[tool.uv.sources]
team-llm = { path = "packages/team-llm", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
